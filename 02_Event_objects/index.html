<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Object Practice</title>
  </head>
  <body>
    <h1>JavaScript Event Object Practice</h1>

    <h2>1. Button Click</h2>
    <button id="clickButton">Click me</button>
    <p id="clickMessage">Click the button to see event details.</p>

    <h2>2. Keyboard Event</h2>
    <input id="keyboardInput" type="text" placeholder="Press a key" />
    <p id="keyboardMessage">The pressed key will appear here.</p>

    <h2>3. Form Submit</h2>
    <form id="userForm">
      <label for="nameInput">Name:</label>
      <input id="nameInput" type="text" required />
      <button type="submit">Submit</button>
    </form>
    <p id="formMessage"></p>

    <h2>4. Remove an Event</h2>
    <button id="startButton">Start Button Event</button>
    <button id="removeButton">Remove Button Event</button>
    <p id="removeMessage">
      Click "Start" and then click the button again to test it.
    </p>

    <script src="script.js"></script>
  </body>
</html>
