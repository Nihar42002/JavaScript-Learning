<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
    <div class="container">
        <h2>Currency Converter</h2>
        <form>
            <div class = "amount">
                <p>Enter Amount:</p>
                <input type="number" id="amount-input" placeholder="Enter amount" value = "1">
            </div>

            <div class = "dropdown">
                <div class="from">
                    <p>From:</p>
                        <div class = "select-container">
                            <img src = "https://flagsapi.com/US/shiny/64.png" alt="Flag">
                            <select id="from-currency" name="from">
                                <option value="USD" selected>USD</option>
                                <option value="EUR">EUR</option>
                                <option value="INR">INR</option>
                                <option value="JPY">JPY</option>
                            </select>
                        </div>
                </div>

                    <i class="fa-solid fa-arrow-right-arrow-left"></i>

                <div class="to">
                    <p>To:</p>
                        <div class = "select-container">
                            <img src = "https://flagsapi.com/IN/shiny/64.png" alt="Flag">
                            <select id="to-currency" name="to">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="INR" selected>INR</option>
                                <option value="JPY">JPY</option>
                            </select>
                        </div>
                </div>
            </div>

            <p id="result">1 USD = 92.45 INR</p>
            <button id="convert-button" type="button">Convert</button>
        </form>
    </div>
    <script src="currency.js"></script>
    <script src="main.js"></script>
</body>
</html>
