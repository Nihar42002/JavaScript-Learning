<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Events Practice</title>
  </head>
  <body>
    <h1>JavaScript Events Practice</h1>

    <h2>1. Mouse Events</h2>
    <button id="clickButton">Click me</button>
    <p id="clickMessage">Click the button to see a message.</p>

    <div
      id="mouseBox"
      style="
        width: 220px;
        padding: 30px;
        margin-top: 10px;
        background-color: lightblue;
      "
    >
      Move your mouse over this box.
    </div>
    <p id="mouseMessage"></p>

    <h2>2. Keyboard Events</h2>
    <input id="keyboardInput" type="text" placeholder="Type something here" />
    <p id="keyboardMessage">Press a key in the input box.</p>

    <h2>3. Form Event</h2>
    <form id="userForm">
      <label for="nameInput">Name:</label>
      <input id="nameInput" type="text" required />
      <button type="submit">Submit</button>
    </form>
    <p id="formMessage"></p>

    <h2>4. Print Event</h2>
    <button id="printButton">Print this page</button>

    <p id="loadMessage"></p>

    <script src="01_mouse_keyboard_form_events.js"></script>
  </body>
</html>
